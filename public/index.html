<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostShare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="logo-title">GhostShare</h1>
      <p class="subtitle">Secure, encrypted, self-destructing notes</p>
    </header>

    <main class="card">
      <div id="tabs" class="tabs">
        <button id="tab-link" class="tab-btn active">Secret Link</button>
        <button id="tab-hide" class="tab-btn">Hide in Image</button>
        <button id="tab-extract" class="tab-btn">Extract from Image</button>
      </div>

      <div id="create-view">
        <div id="text-mode">
          <textarea id="secret-input" placeholder="Passcode, note, or secret key..."></textarea>
          
          <div class="picker-container">
            <div class="picker-label">Self-destruct timer</div>
            <div class="picker-wheels">
              <div class="picker-col">
                <select id="hours-select" class="ios-select"></select>
                <span class="unit">h</span>
              </div>
              <div class="picker-col">
                <select id="minutes-select" class="ios-select"></select>
                <span class="unit">m</span>
              </div>
              <div class="picker-col">
                <select id="seconds-select" class="ios-select"></select>
                <span class="unit">s</span>
              </div>
            </div>
          </div>

          <div class="controls">
            <button class="btn-primary" id="create-btn">Create Link</button>
          </div>
        </div>

        <div id="hide-mode" class="hidden">
          <textarea id="stego-input" placeholder="Secret text to hide inside image..."></textarea>
          <div class="file-picker">
            <input type="file" id="image-input" accept="image/png" class="file-input-hidden">
            <label for="image-input" class="file-box" id="image-box">
              <span id="image-label">Choose PNG Image</span>
              <button type="button" class="clear-file hidden" id="clear-image-btn">&times;</button>
            </label>
          </div>
          <button class="btn-primary" id="stego-btn">Process & Download Image</button>
        </div>

        <div id="extract-mode" class="hidden">
          <div class="file-picker">
            <input type="file" id="extract-input" accept="image/png" class="file-input-hidden">
            <label for="extract-input" class="file-box" id="extract-box">
              <span id="extract-label">Choose Stego PNG Image</span>
              <button type="button" class="clear-file hidden" id="clear-extract-btn">&times;</button>
            </label>
          </div>
          <button class="btn-primary" id="extract-btn">Extract Secret Message</button>
        </div>

        <div id="result-container" class="result-box hidden">
          <input type="text" id="share-url" readonly />
          <button class="btn-primary" id="copy-btn">Copy Link</button>
        </div>

        <div id="stego-result" class="result-box hidden">
          <a id="download-image" class="btn-primary" download="secret.png">Download Stego Image</a>
        </div>

        <div id="extracted-result" class="result-box hidden">
          <textarea id="extracted-output" readonly placeholder="Extracted message will appear here..."></textarea>
        </div>
      </div>

      <div id="read-view" class="hidden">
        <textarea id="decrypted-output" readonly placeholder="Decrypting payload..."></textarea>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
