<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostShare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="logo-title">GhostShare</h1>
      <p class="subtitle">Secure, encrypted, self-destructing notes</p>
    </header>

    <main class="card">
      <div id="tabs" class="tabs">
        <button id="tab-link" class="tab-btn active">Secret Link</button>
        <button id="tab-hide" class="tab-btn">Hide in Image</button>
        <button id="tab-extract" class="tab-btn">Extract from Image</button>
      </div>

      <div id="create-view">
        <div id="text-mode">
          <textarea id="secret-input" placeholder="Passcode, note, or secret key..."></textarea>
          <div class="controls">
            <select id="ttl-select">
              <option value="3600">Self-destruct in 1 hour</option>
              <option value="86400">Self-destruct in 24 hours</option>
              <option value="604800">Self-destruct in 7 days</option>
            </select>
            <button class="btn-primary" id="create-btn">Create Link</button>
          </div>
        </div>

        <div id="result-container" class="result-box hidden">
          <input type="text" id="share-url" readonly />
          <button class="btn-primary" id="copy-btn">Copy Link</button>
        </div>
      </div>

      <div id="read-view" class="hidden">
        <textarea id="decrypted-output" readonly placeholder="Decrypting payload..."></textarea>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
